<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIB Jobs // Recruiter Screen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
    :root {
        --navy-900: #1e2a3b;
        --navy-800: #2a3a4d;
        --navy-700: #334155;
        --navy-600: #4a5e78;
        --slate-400: #8294aa;
        --slate-300: #a8b8c8;
        --slate-200: #c5d1dc;
        --slate-100: #e8eef3;
        --cream: #faf9f7;
        --white: #ffffff;
        --bg-cream: var(--cream);
        --card-white: var(--white);
        --ink-black: var(--navy-900);
        --accent-green: #5d8a66;
        --accent-green-light: #e3efe5;
        --accent-mint: var(--slate-100);
        --accent-clay: #c9785c;
        --accent-clay-light: #f8ebe6;
        --accent-gold: #d4a84b;
        --accent-gold-light: #fdf6e8;
        --accent-violet: #7c6b9e;
        --accent-violet-light: #eeeaf5;
        --border-thick: 2px;
        --shadow-hard: 5px 5px 0px var(--ink-black);
        --shadow-hover: 7px 7px 0px var(--ink-black);
        --shadow-active: 2px 2px 0px var(--ink-black);
        --radius: 6px;
        --radius-lg: 10px;
        --transition-snap: 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        --transition-bounce: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::selection { background: var(--accent-gold); color: var(--ink-black); }
    
    body {
        background: var(--bg-cream);
        color: var(--ink-black);
        font-family: 'DM Sans', sans-serif;
        line-height: 1.7;
        min-height: 100vh;
        font-size: 15px;
        -webkit-font-smoothing: antialiased;
    }
    
    /* HEADER */
    header {
        background: var(--bg-cream);
        padding: 18px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: var(--border-thick) solid var(--ink-black);
        position: sticky;
        top: 0;
        z-index: 100;
    }
    
    .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        text-decoration: none;
        color: inherit;
    }
    
    .logo-icon { width: 48px; height: 48px; flex-shrink: 0; }
    
    .brand-text { display: flex; flex-direction: column; gap: 3px; }
    
    .app-title {
        font-family: 'Space Mono', monospace;
        font-size: 24px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: -0.5px;
        line-height: 1.1;
        color: var(--ink-black);
    }
    
    .app-subtitle {
        font-family: 'Space Mono', monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--ink-black);
        opacity: 0.7;
    }
    
    .header-right { display: flex; align-items: center; gap: 20px; }
    
    .header-stats { display: flex; gap: 16px; align-items: center; }
    
    .stat {
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .stat-num {
        font-weight: 700;
        padding: 4px 10px;
        border: var(--border-thick) solid var(--ink-black);
        background: var(--card-white);
    }
    
    .stat-num.forward { background: var(--accent-green-light); border-color: var(--accent-green); color: var(--accent-green); }
    .stat-num.pass { background: var(--accent-clay-light); border-color: var(--accent-clay); color: var(--accent-clay); }
    
    /* BUTTONS */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 24px;
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: var(--ink-black);
        background: var(--card-white);
        border: var(--border-thick) solid var(--ink-black);
        border-radius: var(--radius);
        cursor: pointer;
        box-shadow: var(--shadow-hard);
        transition: all var(--transition-snap);
        transform: translate(0, 0);
    }
    
    .btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: var(--shadow-hover); }
    .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: var(--shadow-active); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
    
    .btn-success { background: var(--accent-green-light); border-color: var(--accent-green); color: var(--accent-green); }
    .btn-success:hover:not(:disabled) { background: var(--accent-green); color: #fff; }
    
    .btn-danger { background: var(--accent-clay-light); color: var(--accent-clay); border-color: var(--accent-clay); }
    .btn-danger:hover:not(:disabled) { background: var(--accent-clay); color: #fff; }
    
    .btn-warning { background: var(--accent-gold-light); color: #996a00; border-color: var(--accent-gold); }
    .btn-warning:hover:not(:disabled) { background: var(--accent-gold); color: #fff; }
    
    .btn-sm { padding: 8px 14px; font-size: 10px; box-shadow: var(--shadow-active); }
    .btn-sm:hover:not(:disabled) { box-shadow: 4px 4px 0px var(--ink-black); }
    
    /* MAIN LAYOUT */
    main { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 90px); }
    
    /* LEFT PANEL */
    .left-panel {
        background: var(--card-white);
        border-right: var(--border-thick) solid var(--ink-black);
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        position: sticky;
        top: 90px;
        height: calc(100vh - 90px);
        overflow-y: auto;
    }
    
    label {
        display: block;
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        color: var(--navy-700);
    }
    
    textarea {
        width: 100%;
        padding: 16px;
        font-family: 'Space Mono', monospace;
        font-size: 13px;
        line-height: 1.6;
        border: var(--border-thick) solid var(--ink-black);
        border-radius: var(--radius);
        background: #fafafa;
        resize: vertical;
        transition: all var(--transition-snap);
    }
    
    textarea:focus { outline: none; background: #fff; box-shadow: var(--shadow-active); }
    
    .job-input { height: 180px; resize: none; }
    
    /* DROP ZONE */
    .drop-zone-container { flex: 1; display: flex; flex-direction: column; }
    
    .drop-zone {
        flex: 1;
        min-height: 200px;
        border: 3px dashed var(--ink-black);
        border-radius: var(--radius);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        transition: all var(--transition-snap);
        cursor: pointer;
        background: var(--bg-cream);
    }
    
    .drop-zone:hover { background: var(--slate-100); border-color: var(--accent-green); }
    .drop-zone.drag-over { border-color: var(--accent-green); border-style: solid; background: var(--accent-green-light); }
    
    .drop-icon { font-size: 48px; margin-bottom: 16px; }
    
    .drop-text {
        font-family: 'Space Mono', monospace;
        font-size: 12px;
        color: var(--navy-700);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .drop-text strong { display: block; font-size: 13px; margin-bottom: 6px; }
    .drop-hint { font-size: 11px; margin-top: 10px; color: var(--slate-400); text-transform: none; }
    
    .processing {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        background: var(--accent-gold-light);
        border: var(--border-thick) solid var(--accent-gold);
        border-radius: var(--radius);
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        margin-top: 16px;
    }
    
    .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--slate-200);
        border-top-color: var(--accent-green);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* RIGHT PANEL */
    .right-panel { padding: 24px; overflow-y: auto; }
    
    .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 400px;
        color: var(--slate-400);
        text-align: center;
    }
    
    .empty-state .icon { font-size: 64px; margin-bottom: 20px; }
    .empty-state .text { font-family: 'Space Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* CANDIDATE CARDS */
    .candidates-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 24px; }
    
    .candidate-card {
        background: var(--card-white);
        border: var(--border-thick) solid var(--ink-black);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-hard);
        overflow: hidden;
        transition: all var(--transition-snap);
    }
    
    .candidate-card:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-hover); }
    .candidate-card.decided { opacity: 0.8; box-shadow: var(--shadow-active); }
    .candidate-card.decided:hover { transform: none; box-shadow: var(--shadow-active); }
    .candidate-card.forwarded { border-color: var(--accent-green); border-width: 3px; }
    .candidate-card.forwarded .card-header { background: var(--accent-green-light); }
    .candidate-card.passed { border-color: var(--accent-clay); border-width: 3px; }
    .candidate-card.passed .card-header { background: var(--accent-clay-light); }
    
    .card-header {
        padding: 16px 20px;
        background: var(--slate-100);
        border-bottom: var(--border-thick) solid var(--ink-black);
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
    }
    
    .candidate-info { flex: 1; min-width: 0; }
    
    .candidate-name {
        font-family: 'Space Mono', monospace;
        font-weight: 700;
        font-size: 14px;
        line-height: 1.3;
        margin-bottom: 8px;
        word-break: break-word;
    }
    
    .candidate-clearance {
        display: inline-block;
        font-family: 'Space Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 4px 10px;
        border-radius: 4px;
        border: var(--border-thick) solid;
    }
    
    .clearance-ts { background: var(--accent-violet-light); color: var(--accent-violet); border-color: var(--accent-violet); }
    .clearance-secret { background: var(--slate-100); color: var(--navy-700); border-color: var(--navy-700); }
    .clearance-none { background: var(--slate-100); color: var(--slate-400); border-color: var(--slate-200); }
    
    .score-badge { font-family: 'Space Mono', monospace; font-size: 32px; font-weight: 700; line-height: 1; flex-shrink: 0; }
    .score-high { color: var(--accent-green); }
    .score-mid { color: var(--accent-gold); }
    .score-low { color: var(--accent-clay); }
    
    .card-body { padding: 20px; }
    
    .section-label {
        font-family: 'Space Mono', monospace;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--slate-400);
        margin-bottom: 10px;
    }
    
    .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .pills:last-child { margin-bottom: 0; }
    
    .pill {
        font-size: 11px;
        padding: 6px 12px;
        border-radius: 4px;
        font-weight: 600;
        line-height: 1.3;
        border: var(--border-thick) solid;
    }
    
    .pill-match { background: var(--accent-green-light); color: var(--accent-green); border-color: var(--accent-green); }
    .pill-gap { background: var(--accent-clay-light); color: var(--accent-clay); border-color: var(--accent-clay); }
    .pill-none { color: var(--slate-400); font-style: italic; border: none; padding-left: 0; }
    
    .card-actions {
        display: flex;
        gap: 12px;
        padding: 16px 20px;
        background: var(--slate-100);
        border-top: var(--border-thick) solid var(--ink-black);
    }
    
    .card-actions .btn { flex: 1; padding: 14px 16px; }
    .card-actions .btn-sm-action { flex: 0 0 60px; }
    
    .decision-badge {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 14px 16px;
        border-radius: var(--radius);
        font-family: 'Space Mono', monospace;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border: var(--border-thick) solid var(--ink-black);
    }
    
    .decision-forward { background: var(--accent-green); color: #fff; }
    .decision-pass { background: var(--accent-clay); color: #fff; }
    .decision-maybe { background: var(--accent-gold); color: #fff; }
    
    .toast {
        position: fixed;
        bottom: 30px;
        right: 30px;
        background: var(--ink-black);
        color: #fff;
        padding: 16px 24px;
        font-family: 'Space Mono', monospace;
        font-size: 12px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-hard);
        border: 2px solid var(--accent-green);
        transform: translateY(120px);
        opacity: 0;
        transition: all var(--transition-bounce);
        z-index: 1000;
    }
    
    .toast.show { transform: translateY(0); opacity: 1; }
    
    @media (max-width: 900px) {
        main { grid-template-columns: 1fr; }
        .left-panel { position: relative; top: 0; height: auto; border-right: none; border-bottom: var(--border-thick) solid var(--ink-black); }
        .candidates-grid { grid-template-columns: 1fr; }
        .header-stats { display: none; }
    }
</style>
</head>
<body>
<header>
    <a href="https://dibjobs.com" class="brand">
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125">
            <path d="M93.764,38.143l-42-30.515c-1.053-0.764-2.475-0.764-3.527,0l-42,30.515c-1.051,0.764-1.491,2.118-1.09,3.354l16.043,49.374c0.402,1.236,1.554,2.073,2.854,2.073h51.914c1.3,0,2.451-0.837,2.854-2.073l16.043-49.374C95.255,40.261,94.814,38.907,93.764,38.143z M73.777,86.944H26.223L11.526,41.716L50,13.764l38.474,27.953L73.777,86.944z" fill="var(--ink-black)" stroke="var(--ink-black)" stroke-width="6"/>
            <path d="M48.236,32.35L29.748,45.782c-1.051,0.764-1.491,2.118-1.09,3.354l7.062,21.735c0.402,1.236,1.554,2.073,2.854,2.073h22.854c1.3,0,2.451-0.837,2.854-2.073l7.062-21.735c0.401-1.236-0.039-2.59-1.09-3.354L51.764,32.35C50.711,31.586,49.289,31.586,48.236,32.35z M64.962,49.355l-5.715,17.589H40.753l-5.715-17.589L50,38.485L64.962,49.355z" stroke="var(--ink-black)" stroke-width="6"/>
        </svg>
        <div class="brand-text">
            <div class="app-title">DIB Jobs</div>
            <div class="app-subtitle">Recruiter Screen</div>
        </div>
    </a>
    <div class="header-right">
        <div class="header-stats">
            <div class="stat">Forward: <span class="stat-num forward" id="forwardCount">0</span></div>
            <div class="stat">Pass: <span class="stat-num pass" id="passCount">0</span></div>
        </div>
        <button class="btn btn-success" onclick="exportForward()" id="exportBtn" disabled>Export Forward List</button>
    </div>
</header>
<main>
    <div class="left-panel">
        <div>
            <label for="jobInput">Job Description</label>
            <textarea class="job-input" id="jobInput" placeholder="Paste job description here..."></textarea>
        </div>
        <div class="drop-zone-container">
            <label>Drop Resumes</label>
            <div class="drop-zone" id="dropZone">
                <div class="drop-icon">📄</div>
                <div class="drop-text"><strong>Drop PDF/DOCX here</strong>Multiple files supported</div>
                <div class="drop-hint">or click to select files</div>
            </div>
            <input type="file" id="fileInput" multiple accept=".pdf,.docx,.doc,.txt" style="display: none;">
            <div id="processingStatus"></div>
        </div>
    </div>
    <div class="right-panel">
        <div class="empty-state" id="emptyState">
            <div class="icon">📋</div>
            <div class="text">Drop resumes to start screening</div>
        </div>
        <div class="candidates-grid" id="candidatesGrid" style="display: none;"></div>
    </div>
</main>
<div class="toast" id="toast"></div>
<script>
const API_ENDPOINT = 'https://76unm1rlj0.execute-api.us-east-1.amazonaws.com/default/grumpy2';
let candidates = [];
let processingQueue = [];
let isProcessing = false;

document.addEventListener('DOMContentLoaded', () => {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    initDropZone();
});

function initDropZone() {
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(event => {
        dropZone.addEventListener(event, e => { e.preventDefault(); e.stopPropagation(); });
    });
    ['dragenter', 'dragover'].forEach(event => {
        dropZone.addEventListener(event, () => dropZone.classList.add('drag-over'));
    });
    ['dragleave', 'drop'].forEach(event => {
        dropZone.addEventListener(event, () => dropZone.classList.remove('drag-over'));
    });
    dropZone.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => handleFiles(e.target.files));
}

async function handleFiles(files) {
    const jobDesc = document.getElementById('jobInput').value.trim();
    if (!jobDesc || jobDesc.length < 50) { showToast('Please paste a job description first'); return; }
    for (const file of files) { if (isValidFile(file)) processingQueue.push(file); }
    if (!isProcessing) processNextFile();
}

function isValidFile(file) { return ['pdf', 'docx', 'doc', 'txt'].includes(file.name.split('.').pop().toLowerCase()); }

async function processNextFile() {
    if (processingQueue.length === 0) { isProcessing = false; updateProcessingStatus(); return; }
    isProcessing = true;
    const file = processingQueue.shift();
    updateProcessingStatus(file.name);
    try {
        const text = await extractText(file);
        if (!text || text.length < 50) throw new Error('Could not extract text');
        const name = extractNameFromFilename(file.name) || extractNameFromText(text) || file.name;
        const candidate = { id: Date.now() + Math.random(), name, fileName: file.name, resumeText: text, status: 'analyzing', result: null, decision: null };
        candidates.push(candidate);
        renderCandidates();
        const jobDesc = document.getElementById('jobInput').value.trim();
        const result = await analyzeCandidate(jobDesc, text);
        candidate.status = 'complete';
        candidate.result = result;
        renderCandidates();
    } catch (err) { console.error('Error processing file:', err); showToast('Failed to process ' + file.name); }
    processNextFile();
}

async function extractText(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'pdf') {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let text = '';
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(item => item.str).join(' ') + '\n';
        }
        return text;
    }
    if (ext === 'docx') {
        const arrayBuffer = await file.arrayBuffer();
        const result = await mammoth.extractRawText({ arrayBuffer });
        return result.value;
    }
    return await file.text();
}

async function analyzeCandidate(jobDesc, resumeText) {
    const response = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ request_type: 'resume_match', job_description: jobDesc, resume_text: resumeText })
    });
    if (!response.ok) throw new Error('Analysis failed');
    return await response.json();
}

function extractNameFromFilename(filename) {
    if (!filename) return null;
    let name = filename.replace(/\.(pdf|docx?|txt)$/i, '');
    name = name.replace(/(resume|cv|cover.*letter|application)/gi, ' ');
    name = name.replace(/20\d{2}/g, ' ');
    name = name.replace(/(january|february|march|april|may|june|july|august|september|october|november|december|jan|feb|mar|apr|jun|jul|aug|sep|oct|nov|dec)/gi, ' ');
    name = name.replace(/(v\d+|final|draft|updated|new|copy|\d+)/gi, ' ');
    name = name.replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (name.length < 2 || ['resume', 'cv', 'document', 'file', 'untitled'].includes(name.toLowerCase())) return null;
    return name.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
}

function extractNameFromText(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    const headers = new Set(['summary','experience','education','skills','profile','objective','qualifications','contact','resume','cv']);
    for (let i = 0; i < Math.min(lines.length, 15); i++) {
        let line = lines[i];
        if (headers.has(line.toLowerCase()) || line.length < 4 || line.length > 40) continue;
        if (/[@|•:()\/]/.test(line) || /\d{3}.*\d{4}/.test(line) || /\d{4}/.test(line)) continue;
        const words = line.split(/\s+/).filter(w => w.length > 0);
        if (words.length < 2 || words.length > 4) continue;
        if (!words.every(w => /^[A-Za-z][A-Za-z.\-']*$/.test(w))) continue;
        return line === line.toUpperCase() ? line.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()) : line;
    }
    return null;
}

function renderCandidates() {
    const grid = document.getElementById('candidatesGrid');
    const empty = document.getElementById('emptyState');
    if (candidates.length === 0) { empty.style.display = 'flex'; grid.style.display = 'none'; return; }
    empty.style.display = 'none';
    grid.style.display = 'grid';
    const sorted = [...candidates].sort((a, b) => {
        if (a.decision && !b.decision) return 1;
        if (!a.decision && b.decision) return -1;
        return (b.result?.score || 0) - (a.result?.score || 0);
    });
    grid.innerHTML = sorted.map(c => renderCard(c)).join('');
    updateStats();
}

function renderCard(c) {
    const isAnalyzing = c.status === 'analyzing';
    const score = c.result?.score || 0;
    const scoreClass = score >= 75 ? 'score-high' : score >= 50 ? 'score-mid' : 'score-low';
    const clearance = extractClearance(c);
    const clearanceClass = clearance.includes('TS') ? 'clearance-ts' : clearance.includes('Secret') ? 'clearance-secret' : 'clearance-none';
    const strengths = (c.result?.analysis || []).filter(a => a.startsWith('Match:')).map(m => extractKeyPoint(m.replace('Match:', '').trim())).slice(0, 3);
    const gaps = (c.result?.analysis || []).filter(a => a.startsWith('Gap:')).map(g => extractKeyPoint(g.replace('Gap:', '').trim())).slice(0, 2);
    let cardClass = 'candidate-card';
    if (c.decision === 'forward') cardClass += ' forwarded decided';
    else if (c.decision === 'pass') cardClass += ' passed decided';
    else if (c.decision === 'maybe') cardClass += ' decided';
    let actionsHtml = '';
    if (c.decision) {
        const decisionClass = c.decision === 'forward' ? 'decision-forward' : c.decision === 'pass' ? 'decision-pass' : 'decision-maybe';
        const decisionText = c.decision === 'forward' ? '✓ Forward to HM' : c.decision === 'pass' ? '✗ Pass' : '? Maybe';
        actionsHtml = `<span class="decision-badge ${decisionClass}">${decisionText}</span><button class="btn btn-sm-action" onclick="undoDecision('${c.id}')">Undo</button>`;
    } else if (!isAnalyzing) {
        actionsHtml = `<button class="btn btn-success" onclick="decide('${c.id}', 'forward')">Forward</button><button class="btn btn-danger" onclick="decide('${c.id}', 'pass')">Pass</button><button class="btn btn-warning btn-sm-action" onclick="decide('${c.id}', 'maybe')">?</button>`;
    }
    return `<div class="${cardClass}">
        <div class="card-header">
            <div class="candidate-info">
                <div class="candidate-name">${escapeHtml(c.name)}</div>
                <span class="candidate-clearance ${clearanceClass}">${clearance}</span>
            </div>
            <div class="score-badge ${scoreClass}">${isAnalyzing ? '<span class="spinner"></span>' : score + '%'}</div>
        </div>
        <div class="card-body">
            <div class="section-label">Strengths</div>
            <div class="pills">${strengths.length ? strengths.map(s => `<span class="pill pill-match">${escapeHtml(s)}</span>`).join('') : '<span class="pill pill-none">Analyzing...</span>'}</div>
            <div class="section-label">Gaps</div>
            <div class="pills">${gaps.length ? gaps.map(g => `<span class="pill pill-gap">${escapeHtml(g)}</span>`).join('') : `<span class="pill pill-none">${isAnalyzing ? 'Analyzing...' : 'None identified'}</span>`}</div>
        </div>
        <div class="card-actions">${actionsHtml}</div>
    </div>`;
}

function extractClearance(c) {
    const text = (c.resumeText || '').toLowerCase();
    if (text.includes('ts/sci') || text.includes('top secret/sci')) return 'TS/SCI';
    if (text.includes('top secret')) return 'Top Secret';
    if (text.includes('secret clearance')) return 'Secret';
    return 'Unknown';
}

function extractKeyPoint(text) {
    if (!text) return '';
    const arrow = text.indexOf('→');
    if (arrow > 0) return text.substring(0, arrow).trim();
    return text.length > 45 ? text.substring(0, 42) + '...' : text;
}

function decide(id, decision) {
    const c = candidates.find(x => x.id == id);
    if (c) { c.decision = decision; renderCandidates(); showToast(c.name + (decision === 'forward' ? ' forwarded' : decision === 'pass' ? ' passed' : ' marked maybe')); }
}

function undoDecision(id) {
    const c = candidates.find(x => x.id == id);
    if (c) { c.decision = null; renderCandidates(); }
}

function updateStats() {
    document.getElementById('forwardCount').textContent = candidates.filter(c => c.decision === 'forward').length;
    document.getElementById('passCount').textContent = candidates.filter(c => c.decision === 'pass').length;
    document.getElementById('exportBtn').disabled = candidates.filter(c => c.decision === 'forward').length === 0;
}

function updateProcessingStatus(fileName) {
    const el = document.getElementById('processingStatus');
    el.innerHTML = fileName ? '<div class="processing"><span class="spinner"></span> Processing ' + escapeHtml(fileName) + '...</div>' : '';
}

function exportForward() {
    const forwarded = candidates.filter(c => c.decision === 'forward');
    if (!forwarded.length) return;
    const headers = ['Name', 'Score', 'Clearance', 'Top Strengths', 'Key Gaps'];
    const rows = forwarded.map(c => {
        const strengths = (c.result?.analysis || []).filter(a => a.startsWith('Match:')).map(m => extractKeyPoint(m.replace('Match:', '').trim())).slice(0, 3).join(' • ');
        const gaps = (c.result?.analysis || []).filter(a => a.startsWith('Gap:')).map(g => extractKeyPoint(g.replace('Gap:', '').trim())).slice(0, 2).join(' • ');
        return [c.name, (c.result?.score || 0) + '%', extractClearance(c), strengths || 'None identified', gaps || 'None identified'];
    });
    const csv = [headers, ...rows].map(row => row.map(cell => '"' + String(cell).replace(/"/g, '""') + '"').join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'forward-to-hm-' + new Date().toISOString().split('T')[0] + '.csv';
    link.click();
    showToast('Exported ' + forwarded.length + ' candidates');
}

function escapeHtml(str) { return str ? String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') : ''; }
function showToast(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
</script>
</body>
</html>
